# Test a target that has already been built.
#
# Tests run through the Microsoft.Testing.Platform (MTP) integration of
# `dotnet test`, which the calling repository opts into through global.json.
# Code coverage is collected with Microsoft.Testing.Extensions.CodeCoverage and
# written below TestResults/ in the working directory.
name: Test .NET target
description: Test a target that has already been built with Microsoft.Testing.Platform and Microsoft.Testing.Extensions.CodeCoverage.

inputs:
  target:
    description: 'Solution or project to test.'
    required: true
  test-project:
    description: 'Project or solution to test. Empty = target.'
    required: false
    default: ''
  working-directory:
    description: 'Directory containing the solution.'
    required: false
    default: '.'
  configuration:
    description: 'Build configuration.'
    required: false
    default: 'Release'
  coverage-format:
    description: >-
      Comma-separated code coverage output formats passed to
      Microsoft.Testing.Extensions.CodeCoverage: cobertura, xml or coverage.
    required: false
    default: 'cobertura,xml'
  test-args:
    description: 'Extra arguments appended to dotnet test. It could be test filters or other options.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET: ${{ inputs.target }}
        TEST_PROJECT: ${{ inputs.test-project }}
        CONFIGURATION: ${{ inputs.configuration }}
        COVERAGE_FORMAT: ${{ inputs.coverage-format }}
        ARGS: ${{ inputs.test-args }}
      run: |
        set -euo pipefail
        args=()
        if [[ -n "$ARGS" ]]; then read -r -a args <<< "$ARGS"; fi
        subject="${TEST_PROJECT:-$TARGET}"
        location=()
        case "$subject" in
          *.sln|*.slnx) location=(--solution "$subject") ;;
          *.csproj|*.fsproj|*.vbproj) location=(--project "$subject") ;;
          *) location=("$subject") ;;
        esac
        command=(dotnet test "${location[@]}" \
          --no-build \
          --configuration "$CONFIGURATION" \
          --verbosity normal \
          --results-directory TestResults \
          --coverage \
          --coverage-output-format "$COVERAGE_FORMAT")
        command+=("${args[@]}")
        "${command[@]}"
