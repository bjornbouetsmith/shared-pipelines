# Test a target that has already been built.
#
# TRX logging is opt-in. The CI pipeline enables it so it can upload the
# results; the release and version pipelines keep the original plain
# `dotnet test` invocation.
name: Test .NET target
description: Test a target that has already been built, optionally writing TRX results.

inputs:
  target:
    description: 'Solution or project to test.'
    required: true
  working-directory:
    description: 'Directory containing the solution.'
    required: false
    default: '.'
  configuration:
    description: 'Build configuration.'
    required: false
    default: 'Release'
  test-args:
    description: 'Extra arguments appended to dotnet test.'
    required: false
    default: ''
  results-directory:
    description: 'Directory for the coverage files, relative to working-directory.'
    required: false
    default: 'artifacts/test-results'

runs:
  using: composite
  steps:
    - name: Test
      run: dotnet test ${{ inputs.target }}/**/*.Tests.csproj --configuration ${{ inputs.configuration }} --verbosity normal /p:AltCover=true /p:AltCoverReport="${{ inputs.results-directory }}/${{ inputs.results-directory }}/coverage.opencover-unit.xml" /p:AltCoverAttributeFilter=ExcludeFromCodeCoverage /p:AltCoverVisibleBranches=true ${{ inputs.test-args }}
