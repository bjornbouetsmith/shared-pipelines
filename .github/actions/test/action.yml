# Test a target that has already been built.
#
# Code coverage is collected using altcover and written to coverage.opencover.xml in the root of GitHub workspace.
name: Test .NET target
description: Test a target that has already been built with code coverage using altcover.

inputs:
  target:
    description: 'Solution or project to test.'
    required: true
  test-project:
    description: 'Project or solution to test. Empty = target.'
    required: false
    default: ''
  working-directory:
    description: 'Directory containing the solution.'
    required: false
    default: '.'
  configuration:
    description: 'Build configuration.'
    required: false
    default: 'Release'
  test-args:
    description: 'Extra arguments appended to dotnet test. It could be test filters or other options.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET: ${{ inputs.target }}
        TEST_PROJECT: ${{ inputs.test-project }}
        CONFIGURATION: ${{ inputs.configuration }}
        ARGS: ${{ inputs.test-args }}
      run: |
        set -euo pipefail
        args=()
        if [[ -n "$ARGS" ]]; then read -r -a args <<< "$ARGS"; fi
        subject="${TEST_PROJECT:-$TARGET}"
        command=(dotnet test "$subject" \
          --no-build \
          --configuration "$CONFIGURATION" \
          --verbosity normal \
          /p:AltCover=true \
          /p:AltCoverReport="$GITHUB_WORKSPACE/coverage.opencover.xml" \
          /p:AltCoverAttributeFilter=ExcludeFromCodeCoverage \
          /p:AltCoverVisibleBranches=true)
        command+=("${args[@]}")
        "${command[@]}"
