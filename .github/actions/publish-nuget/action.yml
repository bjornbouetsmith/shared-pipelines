# Publish already-packed NuGet packages to nuget.org using OIDC and create the
# matching GitHub release.
#
# This is a composite action, not a reusable workflow, on purpose. A composite
# action runs as steps inside the *calling* job, so the OIDC token's
# `job_workflow_ref` claim points at the caller's workflow file. That is the file
# registered in the nuget.org Trusted Publishing policy. A reusable workflow
# would run in its own workflow context and the claim would point at this
# repository instead, which nuget.org rejects with HTTP 401.
#
# After the push the action creates a GitHub release for the published version
# through the create-release action. The release contains the automatic source
# archives, generated release notes and the published .nupkg files as assets.
# Set create-release to false to opt out.
#
# Call it from a job that has `id-token: write` and `contents: write`:
#
#   publish:
#     needs: build
#     runs-on: ubuntu-latest
#     permissions:
#       contents: write   # create the GitHub release
#       id-token: write   # OIDC login to nuget.org
#     steps:
#       - uses: bjornbouetsmith/shared-pipelines/.github/actions/publish-nuget@v1.6.0
#         with:
#           artifact-name: nuget-packages
#           user: my-nuget-account

name: Publish NuGet packages
description: >-
  Download a workflow artifact, authenticate with nuget.org using GitHub OIDC,
  publish the .nupkg files and create the GitHub release for the version.

inputs:
  artifact-name:
    description: 'Name of the workflow artifact containing the .nupkg files.'
    required: false
    default: 'nuget-packages'
  user:
    description: >-
      nuget.org profile name of the trusted publishing policy creator.
      This is the username passed to NuGet/login, not the package owner.
    required: true
  packages-directory:
    description: 'Directory to download the artifact into and publish from.'
    required: false
    default: 'artifacts/packages'
  dotnet-version:
    description: '.NET SDK version used for dotnet nuget push.'
    required: false
    default: '10.0.x'
  source:
    description: 'nuget.org v3 feed to push to.'
    required: false
    default: 'https://api.nuget.org/v3/index.json'
  push-args:
    description: 'Extra arguments appended to dotnet nuget push.'
    required: false
    default: '--skip-duplicate'
  create-release:
    description: 'Create a GitHub release for the published version. Needs contents: write.'
    required: false
    default: 'true'
  release-tag:
    description: >-
      Tag of the release. Empty = release-tag-prefix plus the version of the
      published .nupkg files.
    required: false
    default: ''
  release-tag-prefix:
    description: 'Prefix prepended to the version when the release tag is derived.'
    required: false
    default: 'v'
  release-name:
    description: 'Release title. Empty = the title GitHub generates from the notes.'
    required: false
    default: ''
  release-notes:
    description: 'Custom release notes, prepended to the generated notes.'
    required: false
    default: ''
  generate-release-notes:
    description: 'Generate release notes with the GitHub Release Notes API.'
    required: false
    default: 'true'
  release-notes-start-tag:
    description: 'Tag to start the generated notes from. Empty = the previous release.'
    required: false
    default: ''
  release-draft:
    description: 'Create the release as a draft instead of publishing it.'
    required: false
    default: 'false'
  release-prerelease:
    description: 'Mark the release as a prerelease: true, false or auto.'
    required: false
    default: 'auto'
  release-verify-tag:
    description: >-
      Fail when the release tag does not exist instead of creating it at the
      workflow commit.
    required: false
    default: 'true'
  release-if-exists:
    description: 'Behaviour when the release already exists: update-assets, skip or fail.'
    required: false
    default: 'update-assets'
  release-assets:
    description: >-
      Newline-separated asset paths or globs. Empty = the published .nupkg
      files.
    required: false
    default: ''
  release-token:
    description: 'Token used to create the release. Needs contents: write. Empty = github.token.'
    required: false
    default: ''

outputs:
  packages_path:
    description: 'Directory containing the published .nupkg files.'
    value: ${{ steps.publish.outputs.packages_path }}
  release_tag:
    description: 'Tag of the GitHub release (empty when create-release is false).'
    value: ${{ steps.release.outputs.tag }}
  release_url:
    description: 'HTML URL of the GitHub release (empty when create-release is false).'
    value: ${{ steps.create-release.outputs.release_url }}

runs:
  using: composite
  steps:
    - name: Download packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.packages-directory }}

    - name: Set up .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: NuGet login (OIDC)
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.user }}

    - name: Publish to nuget.org
      id: publish
      shell: bash
      env:
        PACKAGES_DIR: ${{ inputs.packages-directory }}
        SOURCE: ${{ inputs.source }}
        PUSH_TOKEN: ${{ steps.login.outputs.NUGET_API_KEY }}
        ARGS: ${{ inputs.push-args }}
      run: |
        set -euo pipefail

        if [[ -z "$PUSH_TOKEN" ]]; then
          echo "::error title=nuget.org credentials missing::NuGet/login did not produce an API key."
          exit 1
        fi

        args=()
        if [[ -n "$ARGS" ]]; then read -r -a args <<< "$ARGS"; fi

        mapfile -t packages < <(find "$PACKAGES_DIR" -maxdepth 1 -name '*.nupkg' -print | sort)
        if (( ${#packages[@]} == 0 )); then
          echo "::error title=No packages found::Nothing to publish in '$PACKAGES_DIR'. Check the artifact name and that the build packed the projects."
          exit 1
        fi

        for package in "${packages[@]}"; do
          echo "Pushing ${package##*/} to $SOURCE"
          dotnet nuget push "$package" \
            --api-key "$PUSH_TOKEN" \
            --source "$SOURCE" \
            "${args[@]}"
        done

        echo "packages_path=$PACKAGES_DIR" >> "$GITHUB_OUTPUT"
        delimiter="packages_${RANDOM}${RANDOM}"
        {
          echo "packages<<$delimiter"
          printf '%s\n' "${packages[@]}"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Determine release tag
      id: release
      if: ${{ inputs.create-release == 'true' }}
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
        TAG_PREFIX: ${{ inputs.release-tag-prefix }}
        PACKAGES: ${{ steps.publish.outputs.packages }}
      run: |
        set -euo pipefail

        tag="$RELEASE_TAG"
        if [[ -n "$tag" ]]; then
          echo "Using the configured release tag $tag."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        package_version() {
          local name="${1##*/}"
          name="${name%.nupkg}"
          name="${name%.symbols}"
          # Package IDs may contain dots, so look for the first dot-separated
          # suffix that is a version.
          local -a parts
          local IFS='.'
          read -r -a parts <<< "$name"
          local i suffix
          for (( i = 1; i < ${#parts[@]}; i++ )); do
            suffix="${parts[*]:i}"
            if [[ "$suffix" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?([-+][0-9A-Za-z.-]+)?$ ]]; then
              printf '%s\n' "$suffix"
              return 0
            fi
          done
          return 1
        }

        versions=()
        while IFS= read -r package || [[ -n "$package" ]]; do
          [[ -z "$package" ]] && continue
          if ! version="$(package_version "$package")"; then
            echo "::error title=Version not found::Could not read a version from '${package##*/}'. Set release-tag explicitly."
            exit 1
          fi
          case " ${versions[*]-} " in
            *" $version "*) ;;
            *) versions+=("$version") ;;
          esac
        done <<< "$PACKAGES"

        if (( ${#versions[@]} == 0 )); then
          echo "::error title=Version not found::The published packages did not contain a version. Set release-tag explicitly."
          exit 1
        fi
        if (( ${#versions[@]} > 1 )); then
          echo "::error title=Multiple package versions::The published packages use versions ${versions[*]}. A release has one tag; set release-tag explicitly."
          exit 1
        fi

        tag="${TAG_PREFIX}${versions[0]}"
        echo "Derived release tag $tag from package version ${versions[0]}."
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Create GitHub release
      id: create-release
      if: ${{ inputs.create-release == 'true' }}
      uses: bjornbouetsmith/shared-pipelines/.github/actions/create-release@v1.6.0
      with:
        tag-name: ${{ steps.release.outputs.tag }}
        name: ${{ inputs.release-name }}
        notes: ${{ inputs.release-notes }}
        generate-notes: ${{ inputs.generate-release-notes }}
        notes-start-tag: ${{ inputs.release-notes-start-tag }}
        target-commitish: ${{ github.sha }}
        draft: ${{ inputs.release-draft }}
        prerelease: ${{ inputs.release-prerelease }}
        verify-tag: ${{ inputs.release-verify-tag }}
        files: ${{ inputs.release-assets || steps.publish.outputs.packages }}
        if-exists: ${{ inputs.release-if-exists }}
        token: ${{ inputs.release-token }}
        repository: ${{ github.repository }}
