# Reusable .NET CI pipeline: restore -> (sonar begin) -> build -> test -> (sonar end).
#
# Call it from any repository:
#
#   jobs:
#     ci:
#       permissions:
#         contents: read
#         packages: read          # only needed when nuget-feed-owner is set
#         statuses: write         # only needed for the commit status options
#       uses: bjornbouetsmith/shared-pipelines/.github/workflows/dotnet-ci-build.yml@v1.1.0
#       with:
#         solution: Source/MyApp.slnx
#       secrets: inherit
#
# Every input is optional. With no inputs at all the workflow builds the first
# *.slnx or *.sln found in the repository root using the .NET 10 SDK.
#
# Sonar analysis is opt-in through the `sonar` input; everything the scanner
# needs (host, project key, organization, JDK, coverage reports, extra
# properties, quality gate behaviour and the commit status context) is a
# parameter. See the Sonar section of README.md.
#
# Runner requirement: the steps are bash, so runs-on must be Linux or macOS.
# Full input/secret/output reference: README.md

name: .NET CI Build

on:
  workflow_call:
    inputs:
      solution:
        description: >-
          Solution, project or directory to restore/build/test, relative to
          working-directory. Empty = first *.slnx or *.sln in working-directory.
        type: string
        default: ''
      working-directory:
        description: 'Directory containing the solution.'
        type: string
        default: '.'
      dotnet-version:
        description: >-
          .NET SDK version to install, e.g. "10.0.x" or "8.0.x,10.0.x".
          Ignored when global-json-file is set.
        type: string
        default: '10.0.x'
      global-json-file:
        description: 'global.json to read the SDK version from. Overrides dotnet-version.'
        type: string
        default: ''
      configuration:
        description: 'Build configuration.'
        type: string
        default: 'Release'
      runs-on:
        description: >-
          Runner label(s). Use a JSON array string for several labels, e.g.
          '["self-hosted","linux"]'.
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        type: number
        default: 30
      cache:
        description: 'Cache the NuGet package folder between runs.'
        type: boolean
        default: true
      run-tests:
        description: 'Run dotnet test after the build.'
        type: boolean
        default: true
      test-project:
        description: 'Project or solution to test. Empty = the resolved build target.'
        type: string
        default: ''
      restore-args:
        description: 'Extra arguments appended to dotnet restore.'
        type: string
        default: ''
      build-args:
        description: 'Extra arguments appended to dotnet build.'
        type: string
        default: ''
      test-args:
        description: >-
          Extra arguments appended to dotnet test. Use this for coverage
          generation, e.g. /p:AltCover=true /p:AltCoverReport=...
        type: string
        default: '--verbosity normal'
      upload-test-results:
        description: 'Upload the .trx test results as an artifact.'
        type: boolean
        default: false
      artifact-name:
        description: 'Name of the test results artifact.'
        type: string
        default: 'test-results'
      nuget-feed-owner:
        description: >-
          GitHub Packages owner to authenticate against
          (https://nuget.pkg.github.com/<owner>/index.json).
          Empty = do not add a NuGet source.
        type: string
        default: ''
      set-commit-status:
        description: >-
          Post pending/success/failure commit statuses for the build itself
          (the "continuous-integration/build" style check). Requires the
          statuses: write permission in the calling job.
        type: boolean
        default: false
      status-context:
        description: 'Commit status context used when set-commit-status is true.'
        type: string
        default: 'continuous-integration/build'
      sonar:
        description: 'Run a SonarQube/SonarCloud analysis around the build and test steps.'
        type: boolean
        default: false
      sonar-host-url:
        description: 'SonarQube or SonarCloud server URL.'
        type: string
        default: 'https://sonarcloud.io'
      sonar-project-key:
        description: 'Sonar project key, e.g. owner_repository. Required when sonar is true.'
        type: string
        default: ''
      sonar-organization:
        description: 'SonarCloud organization. Empty = omit the /o argument (self-hosted SonarQube).'
        type: string
        default: ''
      sonar-java-version:
        description: 'JDK version required by the Sonar scanner.'
        type: string
        default: '17'
      sonar-java-distribution:
        description: 'JDK distribution installed with actions/setup-java.'
        type: string
        default: 'oracle'
      sonar-scanner-version:
        description: 'dotnet-sonarscanner tool version. Empty = latest.'
        type: string
        default: ''
      sonar-coverage-reports:
        description: >-
          Value for sonar.cs.opencover.reportsPaths, relative to
          working-directory, e.g. "**/coverage.opencover*.xml".
          Empty = do not import coverage.
        type: string
        default: ''
      sonar-quality-gate-wait:
        description: 'Fail the step when the Sonar quality gate fails (sonar.qualitygate.wait).'
        type: boolean
        default: true
      sonar-extra-args:
        description: >-
          Extra arguments appended to "dotnet-sonarscanner begin", e.g.
          '/d:sonar.exclusions=**/Migrations/**'.
        type: string
        default: ''
      sonar-end-args:
        description: 'Extra arguments appended to "dotnet-sonarscanner end".'
        type: string
        default: ''
      sonar-publish-status:
        description: >-
          Post pending/success/failure commit statuses for the quality gate.
          Requires the statuses: write permission in the calling job.
        type: boolean
        default: true
      sonar-status-context:
        description: 'Commit status context used for the quality gate statuses.'
        type: string
        default: 'continuous-integration/sonarcloud'
    secrets:
      nuget-token:
        description: 'Token for the GitHub Packages feed. Defaults to github.token.'
        required: false
      sonar-token:
        description: 'SonarQube/SonarCloud token. Required when the sonar input is true.'
        required: false
    outputs:
      target:
        description: 'Solution or project that was restored, built and tested.'
        value: ${{ jobs.build.outputs.target }}

# No `permissions:` block on purpose. A called workflow can only reduce the
# caller's GITHUB_TOKEN permissions, and asking for a scope the caller did not
# grant fails the whole run at startup with
# "The workflow is requesting '<scope>', but is only allowed 'none'".
# Declaring the minimum here would therefore force every caller to grant
# `statuses: write` even when both status options are off.
# Grant the scopes you need in the calling job; see README.md.
jobs:
  build:
    name: Restore, build and test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out with full history for Sonar
        if: ${{ inputs.sonar }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out
        if: ${{ !inputs.sonar }}
        uses: actions/checkout@v7

      - name: Validate Sonar inputs
        if: ${{ inputs.sonar }}
        env:
          PROJECT_KEY: ${{ inputs.sonar-project-key }}
          HOST_URL: ${{ inputs.sonar-host-url }}
          SONAR_TOKEN: ${{ secrets.sonar-token }}
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "$PROJECT_KEY" ]]; then
            echo "::error title=sonar-project-key missing::The 'sonar' input is enabled but 'sonar-project-key' is empty."
            missing=1
          fi
          if [[ -z "$HOST_URL" ]]; then
            echo "::error title=sonar-host-url missing::The 'sonar' input is enabled but 'sonar-host-url' is empty."
            missing=1
          fi
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error title=sonar-token missing::The 'sonar' input is enabled but the 'sonar-token' secret is empty. Add it to the calling repository and pass it with 'secrets: inherit'."
            missing=1
          fi
          if (( missing != 0 )); then
            exit 1
          fi

      - name: Set up .NET from global.json
        if: ${{ inputs.global-json-file != '' }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ inputs.global-json-file }}

      - name: Set up .NET
        if: ${{ inputs.global-json-file == '' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Set up JDK for Sonar
        if: ${{ inputs.sonar }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.sonar-java-version }}
          distribution: ${{ inputs.sonar-java-distribution }}

      - name: Install Sonar scanner
        if: ${{ inputs.sonar }}
        env:
          SCANNER_VERSION: ${{ inputs.sonar-scanner-version }}
        run: |
          set -euo pipefail
          args=(--global dotnet-sonarscanner)
          if [[ -n "$SCANNER_VERSION" ]]; then
            args+=(--version "$SCANNER_VERSION")
          fi
          dotnet tool install "${args[@]}" || dotnet tool update "${args[@]}"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$HOME/.dotnet/tools:$PATH"
          # Not "dotnet-sonarscanner --version": recent scanner versions treat a
          # missing begin/end argument as an error and exit 1.
          command -v dotnet-sonarscanner

      - name: Restore NuGet cache
        if: ${{ inputs.cache }}
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props', '**/*.csproj', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Add GitHub Packages NuGet source
        if: ${{ inputs.nuget-feed-owner != '' }}
        env:
          FEED_OWNER: ${{ inputs.nuget-feed-owner }}
          FEED_USER: ${{ github.actor }}
          FEED_TOKEN: ${{ secrets.nuget-token || github.token }}
        run: |
          set -euo pipefail
          dotnet nuget add source \
            --name github \
            --username "$FEED_USER" \
            --password "$FEED_TOKEN" \
            --store-password-in-clear-text \
            "https://nuget.pkg.github.com/${FEED_OWNER}/index.json"

      - name: Resolve build target
        id: resolve
        env:
          INPUT_SOLUTION: ${{ inputs.solution }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          target="$INPUT_SOLUTION"
          if [[ -z "$target" ]]; then
            target="$(find . -maxdepth 1 -type f \( -name '*.slnx' -o -name '*.sln' \) -print -quit)"
            target="${target#./}"
          fi
          if [[ -z "$target" ]]; then
            echo "::error title=No solution found::Set the 'solution' input or add a .sln/.slnx file to '$WORKING_DIRECTORY'."
            exit 1
          fi
          echo "Building '$target'"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Set commit status to pending
        if: ${{ inputs.set-commit-status }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: ${{ inputs.status-context }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$TARGET_URL" --arg context "$STATUS_CONTEXT" \
            '{state: "pending", target_url: $url, description: "The build is pending!", context: $context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $STATUS_TOKEN" \
            "$API_URL/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" -d "$payload"

      - name: Set quality gate status to pending
        if: ${{ inputs.sonar && inputs.sonar-publish-status }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: ${{ inputs.sonar-status-context }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$TARGET_URL" --arg context "$STATUS_CONTEXT" \
            '{state: "pending", target_url: $url, description: "The quality gate is pending!", context: $context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $STATUS_TOKEN" \
            "$API_URL/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" -d "$payload"

      - name: Restore dependencies
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          ARGS: ${{ inputs.restore-args }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ARGS" ]]; then read -r -a args <<< "$ARGS"; fi
          dotnet restore "$TARGET" "${args[@]}"

      - name: Analyse with Sonar (begin)
        if: ${{ inputs.sonar }}
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
          PROJECT_KEY: ${{ inputs.sonar-project-key }}
          ORGANIZATION: ${{ inputs.sonar-organization }}
          HOST_URL: ${{ inputs.sonar-host-url }}
          COVERAGE_REPORTS: ${{ inputs.sonar-coverage-reports }}
          QUALITY_GATE_WAIT: ${{ inputs.sonar-quality-gate-wait }}
          EXTRA_ARGS: ${{ inputs.sonar-extra-args }}
        run: |
          set -euo pipefail
          args=(begin "/k:${PROJECT_KEY}")
          if [[ -n "$ORGANIZATION" ]]; then args+=("/o:${ORGANIZATION}"); fi
          args+=("/d:sonar.host.url=${HOST_URL}" "/d:sonar.login=${SONAR_TOKEN}")
          if [[ -n "$COVERAGE_REPORTS" ]]; then
            args+=("/d:sonar.cs.opencover.reportsPaths=${COVERAGE_REPORTS}")
          fi
          if [[ "$QUALITY_GATE_WAIT" == "true" ]]; then
            args+=("/d:sonar.qualitygate.wait=true")
          fi
          if [[ -n "$EXTRA_ARGS" ]]; then
            read -r -a extra <<< "$EXTRA_ARGS"
            args+=("${extra[@]}")
          fi
          dotnet-sonarscanner "${args[@]}"

      - name: Build
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          CONFIGURATION: ${{ inputs.configuration }}
          ARGS: ${{ inputs.build-args }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ARGS" ]]; then read -r -a args <<< "$ARGS"; fi
          dotnet build "$TARGET" --no-restore --configuration "$CONFIGURATION" "${args[@]}"

      - name: Test
        if: ${{ inputs.run-tests }}
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          TEST_PROJECT: ${{ inputs.test-project }}
          CONFIGURATION: ${{ inputs.configuration }}
          ARGS: ${{ inputs.test-args }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ARGS" ]]; then read -r -a args <<< "$ARGS"; fi
          subject="${TEST_PROJECT:-$TARGET}"
          dotnet test "$subject" \
            --no-build \
            --configuration "$CONFIGURATION" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory artifacts/test-results \
            "${args[@]}"

      - name: Set commit status to success
        if: ${{ inputs.set-commit-status && success() }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: ${{ inputs.status-context }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$TARGET_URL" --arg context "$STATUS_CONTEXT" \
            '{state: "success", target_url: $url, description: "The build succeeded!", context: $context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $STATUS_TOKEN" \
            "$API_URL/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" -d "$payload"

      - name: Set commit status to failure
        if: ${{ inputs.set-commit-status && failure() }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: ${{ inputs.status-context }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$TARGET_URL" --arg context "$STATUS_CONTEXT" \
            '{state: "failure", target_url: $url, description: "The build failed!", context: $context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $STATUS_TOKEN" \
            "$API_URL/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" -d "$payload"

      - name: Analyse with Sonar (end)
        if: ${{ inputs.sonar }}
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
          EXTRA_ARGS: ${{ inputs.sonar-end-args }}
        run: |
          set -euo pipefail
          args=(end "/d:sonar.login=${SONAR_TOKEN}")
          if [[ -n "$EXTRA_ARGS" ]]; then
            read -r -a extra <<< "$EXTRA_ARGS"
            args+=("${extra[@]}")
          fi
          dotnet-sonarscanner "${args[@]}"

      - name: Set quality gate status to success
        if: ${{ inputs.sonar && inputs.sonar-publish-status && success() }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: ${{ inputs.sonar-status-context }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$TARGET_URL" --arg context "$STATUS_CONTEXT" \
            '{state: "success", target_url: $url, description: "The quality gate succeeded!", context: $context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $STATUS_TOKEN" \
            "$API_URL/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" -d "$payload"

      - name: Set quality gate status to failure
        if: ${{ inputs.sonar && inputs.sonar-publish-status && failure() }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          STATUS_CONTEXT: ${{ inputs.sonar-status-context }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg url "$TARGET_URL" --arg context "$STATUS_CONTEXT" \
            '{state: "failure", target_url: $url, description: "The quality gate failed!", context: $context}')"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $STATUS_TOKEN" \
            "$API_URL/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" -d "$payload"

      - name: Upload test results
        if: ${{ inputs.upload-test-results && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/artifacts/test-results
          if-no-files-found: ignore
