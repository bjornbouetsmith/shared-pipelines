# Reusable release-version pipeline for .NET repositories.
#
# Two modes, both in this one workflow:
#
#   prepare  increments the version in <version-file>, builds and tests the
#            change on a release branch and opens a pull request.
#   tag      after the release pull request is merged, creates and pushes the
#            release tag for the version found in <version-file>.
#
# Call it from any repository with an "auto" mode that picks the right half
# from the triggering event:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         version_part:
#           type: choice
#           options: [Patch, Minor, Major]
#           default: Patch
#     push:
#       branches: [ main ]
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#         pull-requests: write   # needed to open the release pull request
#       uses: bjornbouetsmith/shared-pipelines/.github/workflows/increment-version.yml@v1.4.0
#       with:
#         version-part: ${{ inputs.version_part || 'patch' }}
#       secrets: inherit
#
# In "auto" mode (the default) a workflow_dispatch event runs "prepare" and a
# push event runs "tag". Set mode to "prepare" or "tag" to force one half.
#
# Set a RELEASE_TOKEN style secret and pass it as release-token when the pull
# request opened here has to trigger the repository's own CI: events created
# with GITHUB_TOKEN do not start other workflows, and GITHUB_TOKEN-created
# pull requests need "Allow GitHub Actions to create and approve pull requests"
# enabled in the repository settings.
#
# Runner requirement: the steps are bash, so runs-on must be Linux or macOS.
# Full input/secret/output reference: README.md

name: Increment Version and Tag Release

on:
  workflow_call:
    inputs:
      mode:
        description: 'auto, prepare or tag. auto = prepare on workflow_dispatch, tag on push.'
        type: string
        default: 'auto'
      version-part:
        description: 'Semantic version part to increment: patch, minor or major.'
        type: string
        default: 'patch'
      version-file:
        description: >-
          File that holds the <Version>x.y.z</Version> element, relative to the
          repository root.
        type: string
        default: 'Directory.Build.props'
      solution:
        description: >-
          Solution or project to build and test on the release branch, relative
          to working-directory. Empty = first *.slnx or *.sln in working-directory.
        type: string
        default: ''
      working-directory:
        description: 'Directory containing the solution.'
        type: string
        default: '.'
      dotnet-version:
        description: >-
          .NET SDK version to install, e.g. "10.0.x".
          Ignored when global-json-file is set.
        type: string
        default: '10.0.x'
      global-json-file:
        description: 'global.json to read the SDK version from. Overrides dotnet-version.'
        type: string
        default: ''
      configuration:
        description: 'Build configuration used for build and test.'
        type: string
        default: 'Release'
      runs-on:
        description: >-
          Runner label(s). Use a JSON array string for several labels, e.g.
          '["self-hosted","linux"]'.
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        type: number
        default: 30
      cache:
        description: 'Cache the NuGet package folder between runs.'
        type: boolean
        default: true
      run-tests:
        description: 'Build and test the release branch before opening the pull request.'
        type: boolean
        default: true
      restore-args:
        description: 'Extra arguments appended to dotnet restore.'
        type: string
        default: ''
      build-args:
        description: 'Extra arguments appended to dotnet build.'
        type: string
        default: ''
      test-args:
        description: 'Extra arguments appended to dotnet test.'
        type: string
        default: '--verbosity normal'
      nuget-feed-owner:
        description: >-
          GitHub Packages owner to authenticate against while restoring
          (https://nuget.pkg.github.com/<owner>/index.json).
          Empty = do not add a NuGet source.
        type: string
        default: ''
      target-branch:
        description: 'Branch the version bump is based on and tagged.'
        type: string
        default: 'main'
      branch-prefix:
        description: 'Prefix of the release branch, the version is appended to it.'
        type: string
        default: 'release/v'
      tag-prefix:
        description: 'Prefix of the release tag, the version is appended to it.'
        type: string
        default: 'v'
      create-pr:
        description: >-
          Open a pull request for the release branch. When false the branch is
          pushed and only the compare URL is printed.
        type: boolean
        default: true
      pr-title:
        description: 'Pull request title. Empty = "Creating release <tag>".'
        type: string
        default: ''
      commit-author-name:
        description: 'Git author name for the version bump and the tag.'
        type: string
        default: 'github-actions[bot]'
      commit-author-email:
        description: 'Git author email for the version bump and the tag.'
        type: string
        default: '41898282+github-actions[bot]@users.noreply.github.com'
    secrets:
      release-token:
        description: >-
          Token used for the push, the pull request and the tag. Defaults to
          github.token. Needs contents and pull-requests write access.
        required: false
      nuget-token:
        description: 'Token for the GitHub Packages feed. Defaults to github.token.'
        required: false
    outputs:
      version:
        description: 'The new (prepare) or tagged (tag) version.'
        value: ${{ jobs.prepare.outputs.version || jobs.tag.outputs.version }}
      branch:
        description: 'Release branch created by the prepare half.'
        value: ${{ jobs.prepare.outputs.branch }}
      tag:
        description: 'Release tag created by the tag half.'
        value: ${{ jobs.tag.outputs.tag }}

# No `permissions:` block on purpose. A called workflow can only reduce the
# caller's GITHUB_TOKEN permissions, and asking for a scope the caller did not
# grant fails the whole run at startup with
# "The workflow is requesting '<scope>', but is only allowed 'none'".
# Grant `contents: write` and `pull-requests: write` in the calling job; see
# README.md.
jobs:
  prepare:
    name: Bump version, build, test and open PR
    if: >-
      ${{ inputs.mode == 'prepare' ||
      (inputs.mode == 'auto' && github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: release-prepare-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      branch: ${{ steps.version.outputs.branch }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Validate inputs
        uses: bjornbouetsmith/shared-pipelines/.github/actions/validate-version-inputs@v1.4.0
        with:
          mode: ${{ inputs.mode }}
          version-part: ${{ inputs.version-part }}

      - name: Check out ${{ inputs.target-branch }}
        uses: bjornbouetsmith/shared-pipelines/.github/actions/checkout@v1.4.0
        with:
          ref: ${{ inputs.target-branch }}
          token: ${{ secrets.release-token }}

      - name: Set up .NET and NuGet
        uses: bjornbouetsmith/shared-pipelines/.github/actions/setup-dotnet@v1.4.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          global-json-file: ${{ inputs.global-json-file }}
          cache: ${{ inputs.cache }}
          nuget-feed-owner: ${{ inputs.nuget-feed-owner }}
          nuget-token: ${{ secrets.nuget-token }}

      - name: Determine release version
        id: version
        uses: bjornbouetsmith/shared-pipelines/.github/actions/version@v1.4.0
        with:
          operation: increment
          version-file: ${{ inputs.version-file }}
          version-part: ${{ inputs.version-part }}
          branch-prefix: ${{ inputs.branch-prefix }}
          tag-prefix: ${{ inputs.tag-prefix }}

      - name: Create release branch and bump version
        working-directory: .
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          BRANCH: ${{ steps.version.outputs.branch }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          sed -i -E "s#(<Version>)[0-9]+\.[0-9]+\.[0-9]+(</Version>)#\1${NEW_VERSION}\2#" "$VERSION_FILE"
          written="$(sed -nE 's:.*<Version>([0-9]+\.[0-9]+\.[0-9]+)</Version>.*:\1:p' "$VERSION_FILE")"
          if [[ "$written" != "$NEW_VERSION" ]]; then
            echo "::error title=Version bump failed::Expected '$NEW_VERSION' in '$VERSION_FILE', found '$written'."
            exit 1
          fi
          git --no-pager diff -- "$VERSION_FILE"

      - name: Restore dependencies
        if: ${{ inputs.run-tests }}
        id: restore
        uses: bjornbouetsmith/shared-pipelines/.github/actions/restore@v1.4.0
        with:
          solution: ${{ inputs.solution }}
          working-directory: ${{ inputs.working-directory }}
          restore-args: ${{ inputs.restore-args }}

      - name: Build
        if: ${{ inputs.run-tests }}
        uses: bjornbouetsmith/shared-pipelines/.github/actions/build@v1.4.0
        with:
          target: ${{ steps.restore.outputs.target }}
          working-directory: ${{ inputs.working-directory }}
          configuration: ${{ inputs.configuration }}
          build-args: ${{ inputs.build-args }}

      - name: Test
        if: ${{ inputs.run-tests }}
        uses: bjornbouetsmith/shared-pipelines/.github/actions/test@v1.4.0
        with:
          target: ${{ steps.restore.outputs.target }}
          working-directory: ${{ inputs.working-directory }}
          configuration: ${{ inputs.configuration }}
          test-args: ${{ inputs.test-args }}

      - name: Commit and push release branch
        working-directory: .
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
          AUTHOR_NAME: ${{ inputs.commit-author-name }}
          AUTHOR_EMAIL: ${{ inputs.commit-author-email }}
        run: |
          set -euo pipefail
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add "$VERSION_FILE"
          git commit -m "Increment version to $TAG"
          git push --set-upstream origin "$BRANCH"

      - name: Open release pull request
        if: ${{ inputs.create-pr }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.release-token || github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_PART: ${{ inputs.version-part }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          VERSION_FILE: ${{ inputs.version-file }}
          PR_TITLE: ${{ inputs.pr-title }}
        run: |
          set -euo pipefail
          title="${PR_TITLE:-Creating release $TAG}"
          body="$(cat <<EOF
          This pull request increments the version in \`$VERSION_FILE\`.

          - Version part: **$VERSION_PART**
          - New version: **$TAG**
          - Build and tests passed on the release branch.

          Once merged, this workflow creates the tag \`$TAG\` on \`$TARGET_BRANCH\`.
          EOF
          )"
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            --title "$title" \
            --body "$body"

      - name: Report release branch
        if: ${{ !inputs.create-pr }}
        working-directory: .
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Pushed \`$BRANCH\` for $TAG. Open the pull request at:"
          echo "${{ github.server_url }}/${{ github.repository }}/compare/${{ inputs.target-branch }}...$BRANCH?expand=1"

  tag:
    name: Tag merged release
    if: >-
      ${{ inputs.mode == 'tag' ||
      (inputs.mode == 'auto' && github.event_name == 'push' &&
      github.ref_name == inputs.target-branch) }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    concurrency:
      group: release-tag-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - name: Validate inputs
        uses: bjornbouetsmith/shared-pipelines/.github/actions/validate-version-inputs@v1.4.0
        with:
          mode: ${{ inputs.mode }}
          version-part: ${{ inputs.version-part }}
          validate-version-part: 'false'

      - name: Check out ${{ inputs.target-branch }}
        uses: bjornbouetsmith/shared-pipelines/.github/actions/checkout@v1.4.0
        with:
          ref: ${{ inputs.target-branch }}
          full-history: 'true'
          token: ${{ secrets.release-token }}

      - name: Read version
        id: read
        uses: bjornbouetsmith/shared-pipelines/.github/actions/version@v1.4.0
        with:
          operation: read
          version-file: ${{ inputs.version-file }}
          tag-prefix: ${{ inputs.tag-prefix }}

      - name: Create release tag
        id: create_tag
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          TAG: ${{ steps.read.outputs.tag }}
          AUTHOR_NAME: ${{ inputs.commit-author-name }}
          AUTHOR_EMAIL: ${{ inputs.commit-author-email }}
          RELEASE_TOKEN: ${{ secrets.release-token || github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to do."
            exit 0
          fi

          # Tag the commit that introduced the version instead of whatever is
          # currently at the tip of the branch.
          release_commit="$(git log -1 --format=%H -- "$VERSION_FILE")"
          if [[ -z "$release_commit" ]]; then
            echo "::error title=Commit not found::Could not find the commit that changed '$VERSION_FILE'."
            exit 1
          fi

          # Create the tag object and the ref through the REST API rather than
          # with "git push origin $TAG". GITHUB_TOKEN is a GitHub App token and
          # an App may not create a ref that makes workflow files reachable
          # unless it holds the "workflows" permission, which GITHUB_TOKEN never
          # has. Tag pushes to any repository whose history touches
          # .github/workflows therefore fail with
          #   refusing to allow a GitHub App to create or update workflow
          #   '.github/workflows/ci.yml' without `workflows` permission
          # even though the tag itself changes no file. The git data API is not
          # subject to that check.
          tag_payload="$(jq -nc \
            --arg tag "$TAG" \
            --arg message "Release $TAG" \
            --arg object "$release_commit" \
            --arg name "$AUTHOR_NAME" \
            --arg email "$AUTHOR_EMAIL" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, message: $message, object: $object, type: "commit",
              tagger: {name: $name, email: $email, date: $date}}')"
          tag_body="$(mktemp)"
          tag_code="$(curl -sS -o "$tag_body" -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            "$API_URL/repos/${REPOSITORY}/git/tags" \
            -d "$tag_payload")"
          tag_sha="$(jq -r '.sha // empty' < "$tag_body")"
          if [[ "$tag_code" != "201" || -z "$tag_sha" ]]; then
            echo "::error title=Tag creation failed::POST /git/tags returned HTTP $tag_code: $(cat "$tag_body")"
            exit 1
          fi

          ref_payload="$(jq -nc --arg ref "refs/tags/$TAG" --arg sha "$tag_sha" \
            '{ref: $ref, sha: $sha}')"
          ref_body="$(mktemp)"
          ref_code="$(curl -sS -o "$ref_body" -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            "$API_URL/repos/${REPOSITORY}/git/refs" \
            -d "$ref_payload")"
          if [[ "$ref_code" == "403" && "$(cat "$ref_body")" == *"Resource not accessible by integration"* ]]; then
            echo "::error title=Tag creation refused::GitHub refused to create refs/tags/$TAG. This is what an App token without the 'workflows' permission gets when the tagged commit adds a workflow file, and GITHUB_TOKEN can never hold that permission. Pass a PAT or GitHub App token that has it as 'release-token', or tag a commit that does not add .github/workflows files."
            exit 1
          fi
          if [[ "$ref_code" != "201" ]]; then
            echo "::error title=Tag creation failed::POST /git/refs returned HTTP $ref_code: $(cat "$ref_body")"
            exit 1
          fi
          echo "Created and pushed tag $TAG on $release_commit"
