# Reusable .NET release pipeline: restore -> build -> test -> pack -> publish.
#
# Call it from any repository:
#
#   jobs:
#     release:
#       permissions:
#         contents: read
#         packages: write    # required to push to GitHub Packages
#       uses: bjornbouetsmith/shared-pipelines/.github/workflows/release-nuget.yml@v1.5.0
#       with:
#         solution: Source/MyApp.slnx
#         publish-github-packages: true
#         publish-nuget-org: false
#
# By default the workflow packs every packable project in the solution and
# pushes the packages to GitHub Packages of github.repository_owner.
# nuget.org publishing is opt-in. Because nuget.org validates the workflow file
# that requests the OIDC token, publishing to nuget.org from another repository
# should use the public publish-nuget composite action in a caller job:
#   .github/actions/publish-nuget/action.yml
# Passing the nuget-org-api-key secret to this workflow is the API-key fallback.
#
# Runner requirement: the steps are bash, so runs-on must be Linux or macOS.
# Full input/secret/output reference: README.md

name: Release NuGet

on:
  workflow_call:
    inputs:
      solution:
        description: >-
          Solution, project or directory to restore/build/test/pack, relative to
          working-directory. Empty = first *.slnx or *.sln in working-directory.
        type: string
        default: ''
      working-directory:
        description: 'Directory containing the solution.'
        type: string
        default: '.'
      dotnet-version:
        description: >-
          .NET SDK version to install, e.g. "10.0.x".
          Ignored when global-json-file is set.
        type: string
        default: '10.0.x'
      global-json-file:
        description: 'global.json to read the SDK version from. Overrides dotnet-version.'
        type: string
        default: ''
      configuration:
        description: 'Build configuration used for build, test and pack.'
        type: string
        default: 'Release'
      runs-on:
        description: >-
          Runner label(s). Use a JSON array string for several labels, e.g.
          '["self-hosted","linux"]'.
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        type: number
        default: 45
      cache:
        description: 'Cache the NuGet package folder between runs.'
        type: boolean
        default: true
      run-tests:
        description: 'Run dotnet test before packing.'
        type: boolean
        default: true
      test-project:
        description: 'Project or solution to test. Empty = the resolved build target.'
        type: string
        default: ''
      restore-args:
        description: 'Extra arguments appended to dotnet restore.'
        type: string
        default: ''
      build-args:
        description: 'Extra arguments appended to dotnet build.'
        type: string
        default: ''
      test-args:
        description: 'Extra arguments appended to dotnet test.'
        type: string
        default: ''
      coverage-format:
        description: >-
          Comma-separated code coverage output formats passed to
          Microsoft.Testing.Extensions.CodeCoverage: cobertura, xml or coverage.
        type: string
        default: 'cobertura,xml'
      pack-args:
        description: 'Extra arguments appended to dotnet pack.'
        type: string
        default: ''
      packages-directory:
        description: 'Directory the .nupkg files are packed into.'
        type: string
        default: 'artifacts/packages'
      upload-packages-artifact:
        description: 'Upload the packed .nupkg files as a workflow artifact.'
        type: boolean
        default: true
      artifact-name:
        description: 'Name of the packages artifact.'
        type: string
        default: 'nuget-packages'
      allowed-actors:
        description: >-
          Comma separated list of users allowed to run this pipeline, e.g.
          "alice,bob". Empty = allow anyone who can trigger the caller workflow.
        type: string
        default: ''
      nuget-feed-owner:
        description: >-
          Owner of the GitHub Packages feed to push to
          (https://nuget.pkg.github.com/<owner>/index.json).
          Empty = github.repository_owner.
        type: string
        default: ''
      publish-github-packages:
        description: 'Push the packed .nupkg files to GitHub Packages.'
        type: boolean
        default: true
      publish-nuget-org:
        description: 'Push the packed .nupkg files to nuget.org.'
        type: boolean
        default: false
      nuget-org-user:
        description: 'nuget.org profile name, required for the OIDC login.'
        type: string
        default: ''
      nuget-org-source:
        description: 'nuget.org v3 feed to push to.'
        type: string
        default: 'https://api.nuget.org/v3/index.json'
      push-args:
        description: 'Extra arguments appended to every dotnet nuget push.'
        type: string
        default: '--skip-duplicate'
    secrets:
      nuget-token:
        description: 'Token used to push to GitHub Packages. Defaults to github.token.'
        required: false
      nuget-org-api-key:
        description: >-
          Classic nuget.org API key. Optional: when empty, the workflow logs in
          through OIDC and uses the short-lived key it receives.
        required: false
    outputs:
      packages_path:
        description: 'Directory containing the packed .nupkg files.'
        value: ${{ jobs.release.outputs.packages_path }}

# No `permissions:` block on purpose. A called workflow can only reduce the
# caller's GITHUB_TOKEN permissions, and asking for a scope the caller did not
# grant fails the whole run at startup with
# "The workflow is requesting '<scope>', but is only allowed 'none'".
# Declaring the minimum here would force every caller to grant `id-token: write`
# even when publish-nuget-org is off.
# Grant the scopes you need in the calling job; see README.md.
jobs:
  release:
    name: Build, test and publish
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      packages_path: ${{ steps.pack.outputs.packages_path }}
    env:
      PACKAGES_DIR: ${{ inputs.packages-directory }}
      NUGET_ORG_API_KEY: ${{ secrets.nuget-org-api-key }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out
        uses: bjornbouetsmith/shared-pipelines/.github/actions/checkout@v1.5.0

      - name: Validate triggering actor
        if: ${{ inputs.allowed-actors != '' }}
        env:
          ALLOWED: ${{ inputs.allowed-actors }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a allowed <<< "$ALLOWED"
          for candidate in "${allowed[@]}"; do
            candidate="${candidate#"${candidate%%[![:space:]]*}"}"
            candidate="${candidate%"${candidate##*[![:space:]]}"}"
            if [[ "$candidate" == "$ACTOR" ]]; then
              echo "Actor '$ACTOR' is allowed to publish."
              exit 0
            fi
          done
          echo "::error title=Actor not allowed::$ACTOR may not run this release. Allowed: $ALLOWED"
          exit 1

      - name: Validate inputs
        env:
          PUBLISH_NUGET_ORG: ${{ inputs.publish-nuget-org }}
          NUGET_ORG_USER: ${{ inputs.nuget-org-user }}
          PUBLISH_GITHUB_PACKAGES: ${{ inputs.publish-github-packages }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_NUGET_ORG" != "true" && "$PUBLISH_GITHUB_PACKAGES" != "true" ]]; then
            echo "::error title=Nothing to publish::Both publish-github-packages and publish-nuget-org are false."
            exit 1
          fi
          if [[ "$PUBLISH_NUGET_ORG" == "true" && -z "$NUGET_ORG_USER" && -z "$NUGET_ORG_API_KEY" ]]; then
            echo "::error title=nuget.org credentials missing::Set the 'nuget-org-user' input (for OIDC) or the 'nuget-org-api-key' secret."
            exit 1
          fi

      - name: Set up .NET and NuGet
        uses: bjornbouetsmith/shared-pipelines/.github/actions/setup-dotnet@v1.5.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          global-json-file: ${{ inputs.global-json-file }}
          cache: ${{ inputs.cache }}
          nuget-feed-owner: ${{ inputs.nuget-feed-owner || github.repository_owner }}
          nuget-token: ${{ secrets.nuget-token }}

      - name: Restore dependencies
        id: restore
        uses: bjornbouetsmith/shared-pipelines/.github/actions/restore@v1.5.0
        with:
          solution: ${{ inputs.solution }}
          working-directory: ${{ inputs.working-directory }}
          restore-args: ${{ inputs.restore-args }}

      - name: Build
        uses: bjornbouetsmith/shared-pipelines/.github/actions/build@v1.5.0
        with:
          target: ${{ steps.restore.outputs.target }}
          working-directory: ${{ inputs.working-directory }}
          configuration: ${{ inputs.configuration }}
          build-args: ${{ inputs.build-args }}

      - name: Test
        if: ${{ inputs.run-tests }}
        uses: bjornbouetsmith/shared-pipelines/.github/actions/test@v1.5.0
        with:
          target: ${{ steps.restore.outputs.target }}
          test-project: ${{ inputs.test-project }}
          working-directory: ${{ inputs.working-directory }}
          configuration: ${{ inputs.configuration }}
          coverage-format: ${{ inputs.coverage-format }}
          test-args: ${{ inputs.test-args }}

      - name: Pack
        id: pack
        env:
          TARGET: ${{ steps.restore.outputs.target }}
          CONFIGURATION: ${{ inputs.configuration }}
          ARGS: ${{ inputs.pack-args }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ARGS" ]]; then read -r -a args <<< "$ARGS"; fi
          rm -rf "$PACKAGES_DIR"
          dotnet pack "$TARGET" \
            --no-build \
            --configuration "$CONFIGURATION" \
            --output "$PACKAGES_DIR" \
            "${args[@]}"

          mapfile -t packages < <(find "$PACKAGES_DIR" -maxdepth 1 -name '*.nupkg' -print | sort)
          if (( ${#packages[@]} == 0 )); then
            echo "::error title=No packages packed::Nothing was produced in '$PACKAGES_DIR'. Check that the projects are packable (IsPackable=true) and have a <Version>."
            exit 1
          fi
          echo "Packed ${#packages[@]} package(s):"
          printf '  %s\n' "${packages[@]##*/}"
          echo "packages_path=$PACKAGES_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload packages
        if: ${{ inputs.upload-packages-artifact && success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.packages-directory }}
          if-no-files-found: error

      - name: NuGet login (OIDC)
        id: nuget-login
        if: ${{ inputs.publish-nuget-org && inputs.nuget-org-user != '' && env.NUGET_ORG_API_KEY == '' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ inputs.nuget-org-user }}

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish-github-packages }}
        env:
          PUSH_TOKEN: ${{ secrets.nuget-token || github.token }}
          ARGS: ${{ inputs.push-args }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$ARGS" ]]; then read -r -a args <<< "$ARGS"; fi
          mapfile -t packages < <(find "$PACKAGES_DIR" -maxdepth 1 -name '*.nupkg' -print | sort)
          for package in "${packages[@]}"; do
            echo "Pushing ${package##*/} to GitHub Packages"
            dotnet nuget push "$package" \
              --api-key "$PUSH_TOKEN" \
              --source github \
              "${args[@]}"
          done

      - name: Publish to nuget.org
        if: ${{ inputs.publish-nuget-org }}
        env:
          SOURCE: ${{ inputs.nuget-org-source }}
          PUSH_TOKEN: ${{ secrets.nuget-org-api-key || steps.nuget-login.outputs.NUGET_API_KEY }}
          ARGS: ${{ inputs.push-args }}
        run: |
          set -euo pipefail
          if [[ -z "$PUSH_TOKEN" ]]; then
            echo "::error title=nuget.org credentials missing::Neither the 'nuget-org-api-key' secret nor an OIDC login produced an API key."
            exit 1
          fi
          args=()
          if [[ -n "$ARGS" ]]; then read -r -a args <<< "$ARGS"; fi
          mapfile -t packages < <(find "$PACKAGES_DIR" -maxdepth 1 -name '*.nupkg' -print | sort)
          for package in "${packages[@]}"; do
            echo "Pushing ${package##*/} to $SOURCE"
            dotnet nuget push "$package" \
              --api-key "$PUSH_TOKEN" \
              --source "$SOURCE" \
              "${args[@]}"
          done
